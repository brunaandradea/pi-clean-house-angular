<div class="main-content">
  <mat-card class="registration-card">
    <mat-card-header>
      <mat-card-title>
        <h2 class="title-cadastro">Cadastrar</h2>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form class="registration-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput placeholder="Email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome Completo</mat-label>
          <input matInput placeholder="Nome Completo">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Telefone</mat-label>
          <input matInput placeholder="Telefone">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>CPF</mat-label>
          <input matInput placeholder="CPF">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput type="password" placeholder="Senha">
        </mat-form-field>

        <mat-checkbox class="terms-checkbox">Aceito e concordo com os Termos de uso.</mat-checkbox>

        <button mat-raised-button color="primary" class="register-button">Cadastrar</button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
